# NovaCart deployment blueprint for Render
# Docs: https://render.com/docs/blueprint-spec
#
# To deploy:
#   1. Push this repo to GitHub.
#   2. Create a free PostgreSQL database on Neon and copy its connection string
#      (e.g. postgresql://user:pass@ep-xxx-pooler.aws.neon.tech/neondb?sslmode=require).
#   3. On Render: "New +" > "Blueprint" > pick this repo > fill in the sync:false
#      environment variables (DATABASE_URL, JWT_SECRET, VITE_API_URL).
#   4. After the API deploys, set the static site env VITE_API_URL to the API URL
#      (e.g. https://novacart-api.onrender.com) and redeploy the static site.
#      Also add that URL to CLIENT_ORIGIN on the API and redeploy the API.

services:
  - type: web
    name: novacart-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run db:generate && npm run db:deploy && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: CLIENT_ORIGIN
        value: http://localhost:5173
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: static
    name: novacart-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false